services:
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile.aws
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    networks:
      - app_net

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.aws
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    command: ["uv", "run", "python", "-m", "backend.mcp_server"]
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.aws
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ML_URL: http://ml:8100
      MCP_URL: http://mcp-server:8001/mcp
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000
    depends_on:
      ml:
        condition: service_started
      mcp-server:
        condition: service_started
    networks:
      - app_net
      - edge_net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - edge_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - edge_net

networks:
  app_net:
    driver: bridge
  edge_net:
    driver: bridge
